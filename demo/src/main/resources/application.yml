server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false  # 如果是HTTPS，设为true

spring:
  application:
    name: demo
  
  # 数据库配置
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:blockchain_shop}
    username: ${DB_USER:********}
    password: ${DB_PASS:********}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  # 邮件配置
  mail:
    host: smtp.qq.com
    port: 587
    username: ${EMAIL_USER:********}
    password: ${EMAIL_PASS:********}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: true

# 自定义配置
app:
  jwt:
    secret: ${JWT_SECRET:********}
    expiration: 1800000  # 30分钟，单位毫秒
  
  security:
    max-login-attempts: 5
    lock-time-minutes: 120
    password-expiry-days: 90
    admin-invite-code: ${ADMIN_INVITE_CODE:********}
  
  captcha:
    width: 120
    height: 40
    length: 4
    expire-seconds: 300  # 5分钟
  
  email-code:
    expire-seconds: 300  # 5分钟

# 日志配置
logging:
  level:
    com.example.demo: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
